name: Deploy ec2-auto-shutdown

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package Lambda
        working-directory: ec2-auto-shutdown
        run: zip -j lambda.zip lambda_function.py

  deploy:
    runs-on: ubuntu-latest
    needs: package
    if: github.event_name == 'push'

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::925601332263:role/github-actions-aws-tools
          aws-region: us-east-1

      - name: Package and deploy Lambda
        working-directory: ec2-auto-shutdown
        run: bash deploy.sh
